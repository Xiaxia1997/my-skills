<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- TITLE: "{Speaker} 精听批改 {Topic}" --></title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Source+Code+Pro:wght@400&display=swap">
<style>
:root{
  --bg:#FAF8F3;--ink:#2C2924;--red:#C0392B;--blue:#2B5E9E;
  --card:#F0EDE5;--rule:#DDD8C8;--muted:#8E877B;
  --tip-bg:rgba(43,94,158,.08);--pop:#FFFDF7;--pop-border:#D5D0C4;
  --cn-bg:#F5F3EC;--cn-border:#C8C3B5;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1B18;--ink:#E4E0D8;--red:#E25844;--blue:#6BA0D6;
  --card:#2A2826;--rule:#3A3730;--muted:#8A847A;
  --tip-bg:rgba(107,160,214,.1);--pop:#2A2826;--pop-border:#44413A;
  --cn-bg:#252320;--cn-border:#44413A;
}}
:root[data-theme="dark"]{
  --bg:#1C1B18;--ink:#E4E0D8;--red:#E25844;--blue:#6BA0D6;
  --card:#2A2826;--rule:#3A3730;--muted:#8A847A;
  --tip-bg:rgba(107,160,214,.1);--pop:#2A2826;--pop-border:#44413A;
  --cn-bg:#252320;--cn-border:#44413A;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Source Sans 3',sans-serif;
  max-width:740px;margin:0 auto;padding:2.5rem 1.5rem 4rem;line-height:1.65}

h1{font-family:'Crimson Pro',serif;font-weight:700;font-size:1.5rem;margin-bottom:.3rem}
.meta{font-size:.82rem;color:var(--muted);padding-bottom:1.2rem;margin-bottom:2rem;
  border-bottom:1px solid var(--rule)}
.meta span+span::before{content:" · ";margin:0 .3rem}
.source-link{color:var(--blue);text-decoration:none;border-bottom:1px solid transparent}
.source-link:hover{border-bottom-color:var(--blue)}

h2{font-family:'Crimson Pro',serif;font-weight:600;font-size:1.15rem;
  margin:2.5rem 0 1rem;color:var(--muted);letter-spacing:.02em;
  padding-bottom:.4rem;border-bottom:1px dashed var(--rule)}
h2:first-of-type{margin-top:0}

.text{font-size:1.08rem;line-height:2.1;margin-bottom:1rem}
.text p{margin-bottom:1rem}

/* === ERROR MARKUP STYLES === */

/* Substitution: user wrote wrong word -> show strikethrough + correct word */
.fix s{text-decoration:line-through;text-decoration-color:var(--red);
  text-decoration-thickness:1.5px;color:var(--ink);opacity:.5}
.fix em{color:var(--red);font-style:normal;font-weight:600;margin-left:2px}

/* Missing word: inserted in red, no decoration */
ins{color:var(--red);text-decoration:none;font-weight:600}

/* Extra word: red strikethrough */
del{color:var(--red);text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.65}

/* === ANNOTATION TIP (blue dashed underline with popup) === */
.tip{border-bottom:1.5px dashed var(--blue);cursor:pointer;
  padding:0 1px;transition:background .12s;position:relative}
.tip:hover{background:var(--tip-bg);border-radius:2px}
.tip.on{background:var(--tip-bg);border-radius:2px}

/* === POPUP CARD === */
.pop{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);
  width:340px;max-width:90vw;background:var(--pop);border:1px solid var(--pop-border);
  border-radius:8px;padding:.9rem 1rem;font-size:.86rem;line-height:1.55;
  box-shadow:0 4px 16px rgba(0,0,0,.1);z-index:50;display:none;cursor:default}
.pop.show{display:block}
.pop::before{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  border-left:6px solid transparent;border-right:6px solid transparent;
  border-bottom:6px solid var(--pop-border)}
.pop::after{content:"";position:absolute;top:-5px;left:50%;transform:translateX(-50%);
  border-left:6px solid transparent;border-right:6px solid transparent;
  border-bottom:6px solid var(--pop)}
.pop-head{display:flex;align-items:center;gap:.4rem;margin-bottom:.5rem}
.pop-head .word{font-weight:700;font-size:.95rem}
.pop-head .ipa{font-family:'Source Code Pro',monospace;font-size:.8em;color:var(--muted)}
.pop-close{margin-left:auto;background:none;border:none;cursor:pointer;
  color:var(--muted);font-size:1rem;padding:0 2px;line-height:1}
.pop-close:hover{color:var(--ink)}
.pop dt{font-weight:600;color:var(--muted);font-size:.72rem;
  text-transform:uppercase;letter-spacing:.04em;margin-top:.45rem}
.pop dt:first-of-type{margin-top:0}
.pop dd{margin:0}
.pop .ex{color:var(--muted);font-style:italic}
.pop .ex b{font-style:normal;color:var(--ink);font-weight:600}

/* === CHINESE TRANSLATION BLOCK === */
.cn{background:var(--cn-bg);border-left:3px solid var(--cn-border);
  padding:.55rem .85rem;border-radius:0 6px 6px 0;margin:0 0 1.25rem;
  font-size:.9rem;line-height:1.7;color:var(--ink)}

/* === VOCABULARY LIST === */
.vocab{margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid var(--rule)}
.vocab h2{font-family:'Crimson Pro',serif;font-size:1.1rem;font-weight:700;
  margin-bottom:.8rem;display:flex;align-items:center;gap:.5rem;
  border-bottom:none;padding-bottom:0;color:var(--ink)}
.vocab .count{font-size:.78rem;color:var(--muted);font-weight:400}
.vocab-reset{background:none;border:none;cursor:pointer;font-size:.75rem;
  color:var(--muted);margin-left:auto;padding:2px 6px;border-radius:3px}
.vocab-reset:hover{background:var(--rule);color:var(--ink)}
.vlist{display:flex;flex-direction:column;gap:.35rem}
.vitem{display:flex;align-items:baseline;gap:.6rem;padding:.4rem .6rem;
  background:var(--card);border-radius:5px;font-size:.9rem}
.vitem.hidden{display:none}
.vitem .vword{font-weight:600;min-width:120px}
.vitem .vipa{font-family:'Source Code Pro',monospace;font-size:.8em;color:var(--muted);min-width:100px}
.vitem .vdef{color:var(--muted);flex:1}
.vitem .vdel{background:none;border:none;cursor:pointer;color:var(--muted);
  font-size:.85rem;opacity:.3;transition:opacity .15s;padding:0 2px}
.vitem .vdel:hover{opacity:1;color:var(--red)}

/* === STATS DASHBOARD === */
.dashboard{background:var(--card);border-radius:8px;padding:1.2rem 1.4rem;margin-bottom:2rem}
.dash-title{font-family:'Crimson Pro',serif;font-weight:700;font-size:1rem;margin-bottom:.8rem}
.dash-row{display:flex;gap:1.2rem;flex-wrap:wrap;margin-bottom:.8rem}
.dash-num{text-align:center;min-width:80px}
.dash-num .n{font-family:'Crimson Pro',serif;font-size:1.6rem;font-weight:700;line-height:1}
.dash-num .n.red{color:var(--red)}.dash-num .n.grn{color:#2D7040}
.dash-num .n.blu{color:var(--blue)}
.dash-num .l{font-size:.72rem;color:var(--muted);margin-top:.15rem}
.bars{flex:1;min-width:200px}
.bar-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem;font-size:.82rem}
.bar-label{width:110px;text-align:right;color:var(--muted);flex-shrink:0}
.bar-track{flex:1;height:14px;background:var(--rule);border-radius:3px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:3px;transition:width .3s}
.bar-fill.c1{background:var(--red)}.bar-fill.c2{background:#D4803A}
.bar-fill.c3{background:var(--blue)}.bar-fill.c4{background:#2D7040}
.bar-count{font-size:.75rem;color:var(--muted);width:28px;text-align:right}

/* Phrase vocab items (no IPA, wider label) */
.vitem .vphrase{font-weight:600;min-width:160px}

.foot{text-align:center;font-size:.75rem;color:var(--muted);margin-top:3rem;
  padding-top:1rem;border-top:1px solid var(--rule)}

@media(max-width:500px){
  body{padding:1.5rem 1rem 3rem}
  .pop{width:calc(100vw - 2rem);max-width:calc(100vw - 2rem)}
  .vitem .vipa{display:none}
}
</style>
</head>
<body>

<!-- ==================== HEADER ==================== -->
<!-- SECTION: header
     Replace the title, date, time range, and topic description.
-->
<h1><!-- INSERT: "{Speaker} 演讲 — 精听批改 {Topic}" --></h1>
<div class="meta">
  <span><!-- INSERT: "YYYY-MM-DD" --></span>

  <span><a class="source-link" href="__INSERT_SAFE_SOURCE_URL__" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer"><!-- INSERT: "原始视频" or "原始音频" --> ↗</a></span>

<!-- ==================== STATS DASHBOARD ==================== -->
<!-- SECTION: dashboard
     Fill in computed stats: total errors, duration, error density, category distribution.
     Bar widths are percentages of total errors. Sort categories by count descending.
-->
<div class="dashboard">
  <div class="dash-title">错误统计</div>
  <div class="dash-row">
    <div class="dash-num"><div class="n red"><!-- INSERT: total error count --></div><div class="l">总错误</div></div>
    <div class="dash-num"><div class="n blu"><!-- INSERT: "X.X min" --></div><div class="l">音频时长</div></div>
    <div class="dash-num"><div class="n red"><!-- INSERT: "~N" errors/min --></div><div class="l">错误/分钟</div></div>
  </div>
  <div class="bars">
    <!-- Bar order: sort by count descending. Color classes: c1=red, c2=orange, c3=blue, c4=green -->
    <div class="bar-row">
      <span class="bar-label">弱读/漏听功能词</span>
      <div class="bar-track"><div class="bar-fill c1" style="width:<!-- INSERT: percentage -->%"></div></div>
      <span class="bar-count"><!-- INSERT: "~N" --></span>
    </div>
    <div class="bar-row">
      <span class="bar-label">相似音混淆</span>
      <div class="bar-track"><div class="bar-fill c2" style="width:<!-- INSERT: percentage -->%"></div></div>
      <span class="bar-count"><!-- INSERT: "~N" --></span>
    </div>
    <div class="bar-row">
      <span class="bar-label">拼写/词形错误</span>
      <div class="bar-track"><div class="bar-fill c3" style="width:<!-- INSERT: percentage -->%"></div></div>
      <span class="bar-count"><!-- INSERT: "~N" --></span>
    </div>
    <div class="bar-row">
      <span class="bar-label">短语/搭配盲区</span>
      <div class="bar-track"><div class="bar-fill c4" style="width:<!-- INSERT: percentage -->%"></div></div>
      <span class="bar-count"><!-- INSERT: "~N" --></span>
    </div>
  </div>
</div>

<!-- ==================== CONTENT SECTIONS ==================== -->
<!-- SECTION: content
     Repeat this block for each section of the dictation.
     Each section has: h2 heading, section.text with corrected paragraphs, then one
     translation div.cn immediately after every paragraph.

     ERROR MARKUP EXAMPLES:

     Substitution (user wrote wrong word):
       <span class="fix"><s>wrong</s> <em>correct</em></span>

     Substitution with annotation popup:
       <span class="fix"><s>wrong</s>
         <em><span class="tip" data-pop="word-id">correct</span></em></span>

     Missing words (user missed these):
       <ins>missing words here</ins>

     Extra words (user wrote these but they're not in original):
       <del>extra words here</del>

     Standalone annotation (word is correct but worth teaching):
       <span class="tip" data-pop="word-id">annotated word</span>
-->

<h2>Section 1: <!-- INSERT: section title --> (<!-- INSERT: time range -->)</h2>
<section class="text">
  <p>
    <!-- INSERT: Corrected paragraph with error markup.
         User's original words in black. Errors marked with .fix, ins, del as shown above.
         Correct/unmarked words are plain text. -->
  </p>

  <!-- Chinese translation block — add immediately after EVERY paragraph -->
  <div class="cn">
    <!-- INSERT: faithful, natural Chinese translation of the paragraph immediately above.
         Do not substitute error analysis or a vague overview for the actual translation. -->
  </div>
</section>

<!-- Repeat the h2 + section.text + (p + translation) pattern for each section -->

<!-- ==================== VOCABULARY LIST ==================== -->
<!-- SECTION: vocabulary
     Only include words/phrases where "换个语境还会错".
     EXCLUDE: basic grammar (your/you're), obvious typos, function word slips.
     Phrases first (use .vphrase), then single words (use .vword + .vipa).
     Phrases use original/dictionary form — no tense tags.
-->
<section class="vocab">
  <h2>复习词表 <span class="count" id="vCount"></span>
    <button class="vocab-reset" id="vReset">恢复全部</button>
  </h2>
  <div class="vlist" id="vList">

    <!-- ─── Phrase items ─── -->
    <!-- EXAMPLE: phrase vocab item -->

      <span class="vphrase">drive it home</span>
      <span class="vdef">把要点讲透、让人彻底理解 — 你听成 drift a home</span>
      <button class="vdel" onclick="vDel('drive-it-home')">&times;</button>
    </div>

    <!-- ─── Single word items ─── -->
    <!-- EXAMPLE: single word vocab item -->
    <div class="vitem" data-vid="paradigm">
      <span class="vword">paradigm</span>
      <span class="vipa">/ˈpærədaɪm/</span>
      <span class="vdef">范式 — g 不发音，读如 para-dime。你听成 diagram</span>
      <button class="vdel" onclick="vDel('paradigm')">&times;</button>
    </div>

  </div>
</section>

<!-- ==================== FOOTER ==================== -->
<div class="foot">精听材料：<!-- INSERT: "{Speaker} × {Source}" --> · <!-- INSERT: AI agent name --> 辅助批改</div>

<!-- ==================== POPUP TEMPLATES ==================== -->
<!-- SECTION: popups
     One <template> per .tip annotation. id must be "pop-{data-pop value}".

     Available <dt> labels (pick 2-4 per word):
       你听成了, 你写成了, 注意, 含义, 这里的用法, 搭配, 例句,
       词根, 同族, 对比, 语法, 发音要点, AI术语, 比喻用法, 频率,
       语法线索, 词性, 反义

     EXAMPLE popup template:
-->
<template id="pop-<!-- INSERT: word-id -->">
  <div class="pop-head">
    <span class="word"><!-- INSERT: word --></span>
    <span class="ipa"><!-- INSERT: /IPA/ --></span>
  </div>
  <dl>
    <dt>你听成了</dt><dd><!-- INSERT: what user heard — why they confused it --></dd>
    <dt>含义</dt><dd><!-- INSERT: meaning in this context --></dd>
    <dt>例句</dt><dd class="ex"><!-- INSERT: example with <b>word</b> bolded --></dd>
  </dl>
</template>

<!-- ==================== JAVASCRIPT ==================== -->
<!-- Do not modify this script block. Copy it as-is into every output file. -->
<script>
let openPop = null;

function computePopupShift(rect, viewportWidth, margin = 8) {
  const leftShift = Math.max(0, margin - rect.left);
  const rightShift = Math.max(0, rect.right + leftShift - (viewportWidth - margin));
  return leftShift - rightShift;
}

document.querySelectorAll('.tip').forEach(tip => {
  tip.addEventListener('click', e => {
    e.stopPropagation();
    closePop();
    const id = tip.dataset.pop;
    const tpl = document.getElementById('pop-' + id);
    if (!tpl) return;

    const pop = document.createElement('div');
    pop.className = 'pop show';
    const close = document.createElement('button');
    close.className = 'pop-close';
    close.textContent = '×';
    close.onclick = e2 => { e2.stopPropagation(); closePop(); };

    const head = tpl.content.cloneNode(true);
    const headDiv = head.querySelector('.pop-head');
    if (headDiv) headDiv.appendChild(close);
    pop.appendChild(head);

    tip.classList.add('on');
    tip.style.position = 'relative';
    tip.appendChild(pop);
    openPop = { pop, tip };

    requestAnimationFrame(() => {
      const r = pop.getBoundingClientRect();
      const shift = computePopupShift(r, window.innerWidth);
      if (shift) pop.style.transform = `translateX(calc(-50% + ${shift}px))`;
    });
  });
});

function closePop() {
  if (!openPop) return;
  openPop.pop.remove();
  openPop.tip.classList.remove('on');
  openPop = null;
}

document.addEventListener('click', closePop);

/* === VOCABULARY LIST PERSISTENCE ===
   Replace the whole token below with the complete JSON string literal emitted by:
   scripts/encode_content.py --context javascript
*/
const VKEY = __INSERT_JSON_STRING_LITERAL__;
function vGetDel() { try { return JSON.parse(localStorage.getItem(VKEY)||'[]') } catch { return [] } }
function vSaveDel(a) { try { localStorage.setItem(VKEY, JSON.stringify(a)) } catch {} }
function vCount() {
  const all = document.querySelectorAll('.vitem');
  const vis = document.querySelectorAll('.vitem:not(.hidden)');
  document.getElementById('vCount').textContent = vis.length + '/' + all.length;
}
function vDel(id) {
  const el = document.querySelector('.vitem[data-vid="'+id+'"]');
  if (el) el.classList.add('hidden');
  const d = vGetDel(); if (!d.includes(id)){d.push(id);vSaveDel(d)} vCount();
}
vGetDel().forEach(id => {
  const el = document.querySelector('.vitem[data-vid="'+id+'"]');
  if (el) el.classList.add('hidden');
});
vCount();
document.getElementById('vReset').addEventListener('click', () => {
  document.querySelectorAll('.vitem.hidden').forEach(el => el.classList.remove('hidden'));
  vSaveDel([]); vCount();
});
</script>
